name: Business Website Outreach

on:
  schedule:
    - cron: "0 15,18 * * 1-5"   # weekdays 3pm + 6pm UTC (inside US business hours); tune to taste
  workflow_dispatch: {}     # trigger manually from the Actions tab to test

jobs:
  outreach-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --omit=dev

      - name: Run outreach queue
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_BUCKET: ${{ secrets.SUPABASE_BUCKET }}
          AGENTPHONE_API_KEY: ${{ secrets.AGENTPHONE_API_KEY }}
          AGENTPHONE_API_KEY2: ${{ secrets.AGENTPHONE_API_KEY2 }}
          AGENTPHONE_API_KEY3: ${{ secrets.AGENTPHONE_API_KEY3 }}
          AGENTMAIL_API_KEY: ${{ secrets.AGENTMAIL_API_KEY }}
          WEBSITE_BUILD_PRICE_USD: ${{ secrets.WEBSITE_BUILD_PRICE_USD }}
          # Cap how many businesses one run contacts — see
          # outreach-agent.js's MAX_OUTREACH_PER_RUN.
          OUTREACH_MAX_PER_RUN: ${{ secrets.OUTREACH_MAX_PER_RUN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Auto-discovery: where to look and what kinds of business.
          OUTREACH_AREAS: ${{ secrets.OUTREACH_AREAS }}
          OUTREACH_CATEGORIES: ${{ secrets.OUTREACH_CATEGORIES }}
          OUTREACH_TZ: ${{ secrets.OUTREACH_TZ }}
          OUTREACH_COUNTRY_CODE: ${{ secrets.OUTREACH_COUNTRY_CODE }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          OUTREACH_FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: node scripts/scheduled-outreach-run.js
