name: Night Shift Research

on:
  schedule:
    # Runs at the top of every hour. The job itself checks whether it's
    # currently ~2am in America/Los_Angeles and exits immediately if not.
    # Doing it this way (instead of a fixed UTC hour) means it stays
    # correct across daylight saving changes automatically.
    - cron: "0 * * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab to test

jobs:
  night-shift-research:
    runs-on: ubuntu-latest
    steps:
      - name: Check if it's ~2am Pacific
        id: gate
        run: |
          HOUR=$(TZ="America/Los_Angeles" date +%H)
          echo "Current Pacific hour: $HOUR"
          if [ "$HOUR" = "02" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repo
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Set up Node
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: npm install --omit=dev

      - name: Run night shift research
        if: steps.gate.outputs.run == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_BUCKET: ${{ secrets.SUPABASE_BUCKET }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY2: ${{ secrets.GROQ_API_KEY2 }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          OLLAMA_CLOUD_MODEL: ${{ secrets.OLLAMA_CLOUD_MODEL }}
        run: node scripts/night-shift-research.js
