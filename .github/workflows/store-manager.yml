name: Store Manager

on:
  schedule:
    - cron: "0 17 * * *"   # once a day, ~9am Pacific (adjust to taste)
  workflow_dispatch: {}

jobs:
  store-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm install --omit=dev
      - name: Generate + publish a product
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_BUCKET: ${{ secrets.SUPABASE_BUCKET }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY2: ${{ secrets.GROQ_API_KEY2 }}
          SOLANA_WALLET_ADDRESS: ${{ secrets.SOLANA_WALLET_ADDRESS }}
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
          STORE_PRICE_USD: ${{ secrets.STORE_PRICE_USD }}
          STORE_AUTO_PUBLISH: ${{ secrets.STORE_AUTO_PUBLISH }}
          STORE_BASE_URL: ${{ secrets.STORE_BASE_URL }}
        run: node scripts/scheduled-store-run.js
