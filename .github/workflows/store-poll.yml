name: Store Poll

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes — checks pending orders, delivers on payment
  workflow_dispatch: {}

jobs:
  store-poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm install --omit=dev
      - name: Check pending orders + deliver paid ones
        env:
          B2_ENDPOINT:               ${{ secrets.B2_ENDPOINT }}
          B2_BUCKET:                 ${{ secrets.B2_BUCKET }}
          B2_KEY_ID:                 ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY:                ${{ secrets.B2_APP_KEY }}
          SOLANA_WALLET_ADDRESS: ${{ secrets.SOLANA_WALLET_ADDRESS }}
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
          AGENTMAIL_API_KEY: ${{ secrets.AGENTMAIL_API_KEY }}
          AGENTMAIL_DOMAIN: ${{ secrets.AGENTMAIL_DOMAIN }}
        run: node scripts/scheduled-store-poll.js
