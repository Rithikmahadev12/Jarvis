<!DOCTYPE html>
<html lang="en">
<head>
<script src="theme-sync.js"></script>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>J.A.R.V.I.S — Monitors</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="hand-tracking.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000508;font-family:'Share Tech Mono',monospace;color:#a8dff5}
:root{
  --blue:#00c8ff;--glow:rgba(0,200,255,0.45);--bg:#000508;
  --dim:rgba(0,200,255,0.25);--text:#a8dff5;--dim-text:#2e5a78;
  --amber:#ffaa00;--green:#00ff88;--red:#ff3333;
  --hud:'Orbitron',sans-serif;
}
.scan{position:fixed;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,rgba(0,200,255,0.12),transparent);animation:scanMove 8s linear infinite;pointer-events:none;z-index:3}
@keyframes scanMove{from{top:-2px}to{top:100vh}}
.corner{position:fixed;width:40px;height:40px;pointer-events:none;z-index:3}
.corner::before,.corner::after{content:'';position:absolute;background:var(--blue);opacity:0.6}
.corner::before{width:100%;height:1.5px;top:0}.corner::after{width:1.5px;height:100%;top:0}
.corner.tl{top:12px;left:12px}.corner.tr{top:12px;right:12px;transform:scaleX(-1)}
.corner.bl{bottom:12px;left:12px;transform:scaleY(-1)}.corner.br{bottom:12px;right:12px;transform:scale(-1)}

/* ── TOP BAR ── */
#top{position:fixed;top:0;left:0;right:0;height:48px;background:linear-gradient(180deg,rgba(0,4,12,0.98),rgba(0,6,18,0.85));border-bottom:1px solid rgba(0,200,255,0.18);display:flex;align-items:center;justify-content:space-between;padding:0 18px;z-index:60}
.top-title{font-family:var(--hud);font-size:0.82rem;font-weight:900;letter-spacing:0.4em;color:var(--blue);text-shadow:0 0 16px var(--glow)}
.top-right{display:flex;align-items:center;gap:10px;font-size:0.5rem;letter-spacing:0.18em;color:var(--dim-text)}
#mode-label{color:var(--blue);font-family:var(--hud)}
.top-btn{background:rgba(0,200,255,0.06);border:1px solid rgba(0,200,255,0.22);color:var(--dim-text);font-family:var(--hud);font-size:0.36rem;letter-spacing:0.18em;padding:6px 11px;cursor:pointer;text-decoration:none;transition:all 0.2s;border-radius:2px}
.top-btn:hover{border-color:var(--blue);color:var(--blue)}
.top-btn.on{color:#000508;background:var(--blue);border-color:var(--blue)}

/* ── THE WALL ── */
#wall{position:fixed;top:48px;left:0;right:0;bottom:108px;perspective:1800px;overflow:hidden}
#carousel{position:absolute;inset:0}

/* Card base — smaller so they actually fit in the viewport */
.monitor-card{
  position:absolute;top:50%;left:50%;
  width:440px;height:290px;margin:-145px 0 0 -220px;
  background:rgba(0,8,18,0.82);border:1px solid rgba(0,200,255,0.25);border-radius:5px;
  box-shadow:0 0 50px rgba(0,200,255,0.08);overflow:hidden;
  transition:transform 0.55s cubic-bezier(.22,.9,.3,1), opacity 0.5s ease, box-shadow 0.3s;
  will-change:transform,opacity
}
.monitor-card.focused{border-color:rgba(0,200,255,0.55);box-shadow:0 0 70px rgba(0,200,255,0.22)}
.mc-head{display:flex;align-items:center;justify-content:space-between;padding:7px 12px;border-bottom:1px solid rgba(0,200,255,0.12);background:rgba(0,200,255,0.04);flex-shrink:0}
.mc-title{font-family:var(--hud);font-size:0.48rem;letter-spacing:0.2em;color:var(--blue);display:flex;align-items:center;gap:8px}
.mc-title .ico{font-size:0.8rem}
.mc-idx{font-size:0.38rem;color:var(--dim-text);letter-spacing:0.12em;display:flex;align-items:center;gap:6px}
.mc-body{position:absolute;inset:0;top:34px}
.mc-frame-zone{position:absolute;inset:0;z-index:5;cursor:pointer}
.mc-frame-zone.interactive{pointer-events:none;cursor:default}
.mc-iframe{width:100%;height:100%;border:none;background:#000508}

/* Fullscreen expand button — shows on hover of any card */
.mc-expand-btn{
  position:absolute;top:6px;right:6px;z-index:8;
  background:rgba(0,4,14,0.8);border:1px solid rgba(0,200,255,0.35);border-radius:2px;
  color:var(--blue);font-size:0.55rem;width:22px;height:22px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;opacity:0;transition:opacity 0.2s;
  font-family:var(--hud);
}
.monitor-card:hover .mc-expand-btn{opacity:1}

/* ── FULLSCREEN OVERLAY ── */
#fs-overlay{
  display:none;position:fixed;inset:0;z-index:200;
  background:#000508;flex-direction:column;
}
#fs-overlay.open{display:flex}
#fs-head{
  flex-shrink:0;height:44px;
  background:linear-gradient(180deg,rgba(0,4,12,0.98),rgba(0,6,18,0.85));
  border-bottom:1px solid rgba(0,200,255,0.18);
  display:flex;align-items:center;justify-content:space-between;padding:0 18px;
}
#fs-title{font-family:var(--hud);font-size:0.72rem;letter-spacing:0.3em;color:var(--blue)}
#fs-close{
  background:rgba(0,200,255,0.06);border:1px solid rgba(0,200,255,0.3);
  color:var(--blue);font-family:var(--hud);font-size:0.38rem;letter-spacing:0.18em;
  padding:6px 14px;cursor:pointer;border-radius:2px;
}
#fs-close:hover{background:var(--blue);color:#000508}
#fs-body{flex:1;position:relative;overflow:hidden}
#fs-iframe{width:100%;height:100%;border:none;background:#000508}
/* For built-in (monitor/news) content in fullscreen */
#fs-builtin{position:absolute;inset:0}

/* MONITOR card content */
.sys-grid{position:absolute;inset:0;display:flex;flex-direction:column;padding:7px 10px;gap:7px}
.sys-row{display:flex;gap:7px;flex:1;min-height:0}
.sys-panel{flex:1;background:rgba(0,8,18,0.5);border:1px solid rgba(0,200,255,0.1);border-radius:3px;display:flex;flex-direction:column;overflow:hidden;position:relative}
#feed-video{width:100%;height:100%;object-fit:cover;filter:saturate(0.8) brightness(0.9) hue-rotate(180deg) contrast(1.1);opacity:0.92}
.feed-placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:0.5rem;color:var(--dim-text);letter-spacing:0.08em;padding:12px;line-height:1.6}
.tele-row{display:flex;align-items:center;gap:6px;padding:5px 9px;font-size:0.47rem}
.tele-label{color:var(--dim-text);width:24px}
.tele-bar-wrap{flex:1;height:3px;background:rgba(0,200,255,0.08);border-radius:2px;overflow:hidden}
.tele-bar{height:100%;background:var(--blue);box-shadow:0 0 5px var(--blue)}
.tele-val{color:var(--text);width:28px;text-align:right}
#ticker-wrap{height:20px;background:rgba(0,8,18,0.6);border:1px solid rgba(0,200,255,0.1);border-radius:3px;overflow:hidden;position:relative;flex-shrink:0}
#ticker-track{position:absolute;white-space:nowrap;font-size:0.47rem;top:50%;transform:translateY(-50%);animation:tickerScroll 30s linear infinite}
#ticker-track span{margin-right:34px}.up{color:var(--green)}

/* NEWS card content */
.news-controls{display:flex;gap:4px;padding:6px 9px;flex-wrap:wrap;border-bottom:1px solid rgba(0,200,255,0.08)}
.news-cat-btn{font-family:var(--hud);font-size:0.3rem;letter-spacing:0.1em;color:var(--dim-text);border:1px solid rgba(0,200,255,0.15);padding:3px 7px;border-radius:8px;cursor:pointer;background:none}
.news-cat-btn.active{color:var(--blue);border-color:var(--blue)}
.news-list{position:absolute;top:30px;left:0;right:0;bottom:0;overflow-y:auto;padding:5px 9px;scrollbar-width:thin}
.news-item{display:block;padding:7px 5px;border-bottom:1px solid rgba(0,200,255,0.06);text-decoration:none;color:var(--text)}
.news-item:hover{background:rgba(0,200,255,0.06)}
.news-item-title{font-size:0.58rem;line-height:1.4;margin-bottom:2px}
.news-item-meta{font-size:0.4rem;color:var(--dim-text);letter-spacing:0.05em}
.news-loading,.news-error{padding:16px;font-size:0.52rem;color:var(--dim-text);text-align:center;line-height:1.7}

/* ── INDICATOR RAIL ── */
#rail{position:fixed;left:0;right:0;bottom:108px;height:0;display:flex;justify-content:center;z-index:40}
#rail-pills{position:absolute;bottom:8px;display:flex;gap:8px;background:rgba(0,4,12,0.7);border:1px solid rgba(0,200,255,0.15);border-radius:14px;padding:5px 10px}
.rail-pill{font-family:var(--hud);font-size:0.3rem;letter-spacing:0.1em;color:var(--dim-text);padding:3px 8px;border-radius:10px;cursor:pointer;white-space:nowrap}
.rail-pill.active{color:#000508;background:var(--blue)}

/* ── PERSISTENT JARVIS CHAT ── */
#reply-toast{position:fixed;left:0;right:0;bottom:116px;display:flex;justify-content:center;z-index:70;pointer-events:none}
#reply-card{max-width:640px;width:88%;background:rgba(0,4,14,0.97);border:1px solid rgba(0,200,255,0.4);box-shadow:0 0 36px rgba(0,200,255,0.15);border-radius:3px;padding:10px 18px;opacity:0;transform:translateY(6px);transition:all 0.25s}
#reply-card.show{opacity:1;transform:translateY(0)}
.rt-label{font-family:var(--hud);font-size:0.3rem;letter-spacing:0.26em;color:rgba(0,200,255,0.5);margin-bottom:4px}
#reply-text{font-size:0.68rem;color:var(--text);line-height:1.5}

#chat-bar{position:fixed;bottom:0;left:0;right:0;height:80px;background:rgba(0,3,10,0.97);border-top:1px solid rgba(0,200,255,0.15);z-index:65;display:flex;flex-direction:column;padding:8px 18px;gap:6px}
.nav-cluster{display:flex;align-items:center;gap:8px}
.nav-btn{font-family:var(--hud);font-size:0.34rem;letter-spacing:0.14em;color:var(--dim-text);border:1px solid rgba(0,200,255,0.18);background:rgba(0,200,255,0.04);padding:5px 10px;border-radius:2px;cursor:pointer}
.nav-btn:hover{color:var(--blue);border-color:var(--blue)}
.ib-hint{font-size:0.32rem;color:rgba(0,200,255,0.28);letter-spacing:0.05em}
.cb-row{display:flex;align-items:center;gap:8px}
#cmd-input{flex:1;background:rgba(0,200,255,0.05);border:1px solid rgba(0,200,255,0.18);border-radius:2px;color:var(--text);font-family:'Share Tech Mono',monospace;font-size:0.78rem;padding:0 14px;height:34px;outline:none}
#cmd-input:focus{border-color:rgba(0,200,255,0.5)}
#cmd-input::placeholder{color:var(--dim-text);opacity:0.7}
#voice-btn,#send-btn{background:rgba(0,200,255,0.07);border:1px solid rgba(0,200,255,0.22);border-radius:2px;color:var(--blue);height:34px;cursor:pointer;flex-shrink:0}
#voice-btn{font-size:0.95rem;padding:0 10px}
#voice-btn.listening{color:var(--red);background:rgba(255,51,51,0.1);animation:micPulse 0.8s ease-in-out infinite}
@keyframes micPulse{0%,100%{opacity:1}50%{opacity:0.4}}
#send-btn{font-family:var(--hud);font-size:0.36rem;letter-spacing:0.18em;padding:0 13px}
@keyframes tickerScroll{from{left:0}to{left:-100%}}

/* Gesture hint flash */
#gesture-hint{
  position:fixed;top:60px;left:50%;transform:translateX(-50%);
  font-family:var(--hud);font-size:0.44rem;letter-spacing:0.2em;
  color:var(--blue);background:rgba(0,4,14,0.92);
  border:1px solid rgba(0,200,255,0.3);border-radius:3px;
  padding:7px 18px;z-index:150;
  opacity:0;transition:opacity 0.3s;pointer-events:none;
}
#gesture-hint.show{opacity:1}

@media (max-width:760px){
  .monitor-card{width:290px;height:200px;margin:-100px 0 0 -145px}
  #wall{bottom:90px}#rail{bottom:90px}
}
</style>
</head>
<body>

<div class="scan"></div>
<div class="corner tl"></div><div class="corner tr"></div>
<div class="corner bl"></div><div class="corner br"></div>
<div id="gesture-hint"></div>

<div id="top">
  <div class="top-title">J.A.R.V.I.S</div>
  <div class="top-right">
    <span>MODE:</span><span id="mode-label">FOCUS</span>
    <button class="top-btn" id="hand-toggle" onclick="toggleHandControl()">🖐 HAND CONTROL: OFF</button>
    <a class="top-btn" href="index.html">← MAIN HUD</a>
  </div>
</div>

<div id="wall"><div id="carousel"></div></div>
<div id="rail"><div id="rail-pills"></div></div>

<!-- FULLSCREEN OVERLAY -->
<div id="fs-overlay">
  <div id="fs-head">
    <span id="fs-title">MONITOR</span>
    <button id="fs-close" onclick="closeFullscreen()">✕ CLOSE</button>
  </div>
  <div id="fs-body">
    <iframe id="fs-iframe" title="fullscreen"></iframe>
    <div id="fs-builtin"></div>
  </div>
</div>

<div id="reply-toast"><div id="reply-card"><div class="rt-label">J.A.R.V.I.S</div><div id="reply-text"></div></div></div>

<div id="chat-bar">
  <div class="nav-cluster">
    <button class="nav-btn" onclick="manualSwipe('left')">‹ PREV</button>
    <button class="nav-btn" onclick="toggleOverview()">⇕ OVERVIEW / FOCUS</button>
    <button class="nav-btn" onclick="manualSwipe('right')">NEXT ›</button>
    <span class="ib-hint">— swipe one hand left/right · raise both wrists high to see all monitors · click any card to fullscreen</span>
  </div>
  <div class="cb-row">
    <input id="cmd-input" type="text" placeholder='Talk to JARVIS — try "show me the news"' autocomplete="off"/>
    <button id="voice-btn" title="Voice input">🎙</button>
    <button id="send-btn" onclick="sendCommand()">SEND</button>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════
// MONITORS
// ═══════════════════════════════════════════════════════════════
const MONITORS = [
  { id: 'monitor',   label: 'MONITOR',   ico: '▣' },
  { id: 'news',      label: 'NEWS',      ico: '▤' },
  { id: 'comms',     label: 'COMMS',     ico: '☎', file: 'comms.html' },
];
let focusedIndex = 0;
let mode = 'focus'; // 'focus' | 'overview'
const loadedFrames = new Set();

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ═══════════════════════════════════════════════════════════════
// BUILD CARDS
// ═══════════════════════════════════════════════════════════════
function buildCards() {
  const carousel = document.getElementById('carousel');
  carousel.innerHTML = MONITORS.map((m, i) => `
    <div class="monitor-card" data-i="${i}">
      <div class="mc-head">
        <span class="mc-title"><span class="ico">${m.ico}</span>${m.label}</span>
        <span class="mc-idx"><span>${i + 1} / ${MONITORS.length}</span></span>
      </div>
      <div class="mc-body">
        <div class="mc-frame-zone" data-i="${i}"></div>
        <button class="mc-expand-btn" data-i="${i}" title="Fullscreen">⛶</button>
        ${m.id === 'monitor' ? monitorMarkup() : m.id === 'news' ? newsMarkup() : `<iframe class="mc-iframe" id="frame-${m.id}" title="${m.label}"></iframe>`}
      </div>
    </div>
  `).join('');

  // Click frame-zone: in overview → focus that monitor; in focus → fullscreen
  document.querySelectorAll('.mc-frame-zone').forEach(zone => {
    zone.addEventListener('click', () => {
      const i = parseInt(zone.dataset.i, 10);
      if (mode === 'overview') {
        focusMonitor(i);
      } else if (i === focusedIndex) {
        openFullscreen(i);
      } else {
        focusMonitor(i);
      }
    });
  });

  // Expand button always opens fullscreen regardless of mode
  document.querySelectorAll('.mc-expand-btn').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      openFullscreen(parseInt(btn.dataset.i, 10));
    });
  });
}

function monitorMarkup() {
  return `
    <div class="sys-grid">
      <div class="sys-row" style="flex:1.3">
        <div class="sys-panel">
          <video id="feed-video" autoplay muted playsinline></video>
          <div class="feed-placeholder" id="feed-placeholder">Camera offline, Sir.<br/>Turn on hand control (top right) to bring the feed up.</div>
        </div>
      </div>
      <div class="sys-row" style="flex:0.7">
        <div class="sys-panel">
          <div class="tele-row"><span class="tele-label">CPU</span><div class="tele-bar-wrap"><div class="tele-bar" id="bar-cpu" style="width:38%"></div></div><span class="tele-val" id="val-cpu">38%</span></div>
          <div class="tele-row"><span class="tele-label">MEM</span><div class="tele-bar-wrap"><div class="tele-bar" id="bar-mem" style="width:54%"></div></div><span class="tele-val" id="val-mem">54%</span></div>
          <div class="tele-row"><span class="tele-label">NET</span><div class="tele-bar-wrap"><div class="tele-bar" id="bar-net" style="width:21%"></div></div><span class="tele-val" id="val-net">21%</span></div>
        </div>
      </div>
      <div id="ticker-wrap"><div id="ticker-track"></div></div>
    </div>`;
}

const NEWS_CATS = ['general', 'technology', 'business', 'science', 'health', 'sports', 'entertainment'];
function newsMarkup() {
  return `
    <div class="news-controls" id="news-controls">
      ${NEWS_CATS.map(c => `<button class="news-cat-btn${c === 'general' ? ' active' : ''}" data-cat="${c}">${c.toUpperCase()}</button>`).join('')}
    </div>
    <div class="news-list" id="news-list"><div class="news-loading">Say "jarvis show me the news," or pick a category, Sir.</div></div>`;
}

// ═══════════════════════════════════════════════════════════════
// LAYOUT — carousel "focus" vs 3×2 grid "overview"
// Cards are 440×290 with margin anchored at center
// ═══════════════════════════════════════════════════════════════
function layout() {
  document.getElementById('mode-label').textContent = mode.toUpperCase();
  document.querySelectorAll('.monitor-card').forEach(card => {
    const i = parseInt(card.dataset.i, 10);
    const zone = card.querySelector('.mc-frame-zone');
    if (mode === 'focus') {
      const off = i - focusedIndex, abs = Math.abs(off);
      // Spread cards 300px apart (card is 440px wide so ~68% visible for adjacent)
      const tx = off * 300, tz = -abs * 120, scale = Math.max(0.3, 1 - abs * 0.22), rot = off * -14;
      card.style.transform = `translate(-50%,-50%) translate3d(${tx}px,0,${tz}px) rotateY(${rot}deg) scale(${scale})`;
      card.style.opacity = abs > 3 ? 0 : Math.max(0, 1 - abs * 0.3);
      card.style.zIndex = 100 - abs;
      card.classList.toggle('focused', off === 0);
      zone.classList.toggle('interactive', off === 0);
    } else {
      // 3 columns × 2 rows — spread to fit the viewport
      const cols = 3, col = i % cols, row = Math.floor(i / cols);
      const gx = (col - 1) * 290, gy = (row - 0.5) * 220;
      card.style.transform = `translate(-50%,-50%) translate3d(${gx}px,${gy}px,0) scale(0.5)`;
      card.style.opacity = 1;
      card.style.zIndex = 10;
      card.classList.toggle('focused', i === focusedIndex);
      zone.classList.remove('interactive');
    }
  });
  document.querySelectorAll('.rail-pill').forEach(p => p.classList.toggle('active', parseInt(p.dataset.i, 10) === focusedIndex));
}

function buildRail() {
  document.getElementById('rail-pills').innerHTML = MONITORS.map((m, i) =>
    `<span class="rail-pill" data-i="${i}" onclick="focusMonitor(${i})">${m.ico} ${m.label}</span>`
  ).join('');
}

function lazyLoad(i) {
  const m = MONITORS[i];
  if (!m.file || loadedFrames.has(m.id)) return;
  document.getElementById('frame-' + m.id).src = m.file;
  loadedFrames.add(m.id);
}

function focusMonitor(i) {
  focusedIndex = Math.max(0, Math.min(MONITORS.length - 1, i));
  mode = 'focus';
  lazyLoad(focusedIndex);
  layout();
  if (MONITORS[focusedIndex].id === 'news') loadNews(currentNewsCat);
}

function manualSwipe(dir) {
  focusedIndex = dir === 'right'
    ? Math.min(MONITORS.length - 1, focusedIndex + 1)
    : Math.max(0, focusedIndex - 1);
  if (mode === 'focus') lazyLoad(focusedIndex);
  layout();
}

function toggleOverview() {
  mode = mode === 'overview' ? 'focus' : 'overview';
  if (mode === 'focus') lazyLoad(focusedIndex);
  layout();
}

// ═══════════════════════════════════════════════════════════════
// FULLSCREEN — opens a monitor card full-viewport
// For iframe monitors → loads in #fs-iframe
// For built-in (monitor/news) → clones markup into #fs-builtin
// ═══════════════════════════════════════════════════════════════
let fsActive = false;
function openFullscreen(i) {
  const m = MONITORS[i];
  focusedIndex = i;
  layout();

  const overlay = document.getElementById('fs-overlay');
  const iframe  = document.getElementById('fs-iframe');
  const builtin = document.getElementById('fs-builtin');
  document.getElementById('fs-title').textContent = m.ico + '  ' + m.label;

  iframe.style.display  = 'none';
  builtin.style.display = 'none';
  builtin.innerHTML = '';

  if (m.file) {
    iframe.src = m.file;
    loadedFrames.add(m.id);
    iframe.style.display = 'block';
  } else if (m.id === 'monitor') {
    builtin.innerHTML = `<div class="sys-grid" style="position:absolute;inset:0;padding:14px 18px;gap:12px">
      <div class="sys-row" style="flex:1.4">
        <div class="sys-panel">
          <video id="fs-feed-video" autoplay muted playsinline style="width:100%;height:100%;object-fit:cover;filter:saturate(0.8) brightness(0.9) hue-rotate(180deg) contrast(1.1)"></video>
        </div>
      </div>
      <div class="sys-row" style="flex:0.6">
        <div class="sys-panel">
          <div class="tele-row"><span class="tele-label">CPU</span><div class="tele-bar-wrap"><div class="tele-bar" id="fs-bar-cpu" style="width:38%"></div></div><span class="tele-val" id="fs-val-cpu">38%</span></div>
          <div class="tele-row"><span class="tele-label">MEM</span><div class="tele-bar-wrap"><div class="tele-bar" id="fs-bar-mem" style="width:54%"></div></div><span class="tele-val" id="fs-val-mem">54%</span></div>
          <div class="tele-row"><span class="tele-label">NET</span><div class="tele-bar-wrap"><div class="tele-bar" id="fs-bar-net" style="width:21%"></div></div><span class="tele-val" id="fs-val-net">21%</span></div>
        </div>
      </div>
    </div>`;
    builtin.style.display = 'block';
    // Mirror the existing camera stream to the fullscreen video
    const mainVid = document.getElementById('feed-video');
    const fsVid   = document.getElementById('fs-feed-video');
    if (mainVid && mainVid.srcObject) fsVid.srcObject = mainVid.srcObject;
  } else if (m.id === 'news') {
    builtin.innerHTML = `<div style="position:absolute;inset:0;display:flex;flex-direction:column">
      <div class="news-controls" id="fs-news-controls" style="flex-shrink:0">
        ${NEWS_CATS.map(c => `<button class="news-cat-btn${c === currentNewsCat ? ' active' : ''}" data-cat="${c}" onclick="fsCatClick(this,'${c}')">${c.toUpperCase()}</button>`).join('')}
      </div>
      <div class="news-list" id="fs-news-list" style="position:relative;top:0;flex:1"><div class="news-loading">Loading headlines, Sir…</div></div>
    </div>`;
    builtin.style.display = 'block';
    loadNewsInto('fs-news-list', currentNewsCat);
  }

  overlay.classList.add('open');
  fsActive = true;
}

function fsCatClick(btn, cat) {
  currentNewsCat = cat;
  document.querySelectorAll('#fs-news-controls .news-cat-btn').forEach(b => b.classList.toggle('active', b === btn));
  loadNewsInto('fs-news-list', cat);
}

function closeFullscreen() {
  document.getElementById('fs-overlay').classList.remove('open');
  document.getElementById('fs-iframe').src = '';
  fsActive = false;
}

document.addEventListener('keydown', e => {
  if (fsActive && e.key === 'Escape') { closeFullscreen(); return; }
  if (e.target.id === 'cmd-input') return;
  if (e.key === 'ArrowRight') manualSwipe('right');
  if (e.key === 'ArrowLeft')  manualSwipe('left');
  if (e.key.toLowerCase() === 'o') toggleOverview();
  if (e.key.toLowerCase() === 'f') openFullscreen(focusedIndex);
});

buildCards();
buildRail();
layout();

// ═══════════════════════════════════════════════════════════════
// NEWS — real headlines via /api/news
// ═══════════════════════════════════════════════════════════════
let currentNewsCat = 'general';

async function loadNewsInto(listId, category) {
  const list = document.getElementById(listId);
  if (!list) return;
  list.innerHTML = '<div class="news-loading">Pulling headlines, Sir…</div>';
  try {
    const res = await fetch(`/api/news?category=${encodeURIComponent(category || 'general')}`);
    const d = await res.json();
    if (d.error) { list.innerHTML = `<div class="news-error">${escapeHtml(d.error)}</div>`; return; }
    if (!d.articles || !d.articles.length) { list.innerHTML = '<div class="news-error">No headlines came back, Sir.</div>'; return; }
    list.innerHTML = d.articles.map(a => `
      <a class="news-item" href="${a.url || '#'}" target="_blank" rel="noopener">
        <div class="news-item-title">${escapeHtml(a.title || 'Untitled')}</div>
        <div class="news-item-meta">${escapeHtml(a.source || '')}${a.publishedAt ? ' · ' + new Date(a.publishedAt).toLocaleString() : ''}</div>
      </a>`).join('');
  } catch {
    list.innerHTML = '<div class="news-error">Could not reach the news service, Sir.</div>';
  }
}

function loadNews(category) { loadNewsInto('news-list', category); }

document.addEventListener('click', e => {
  const btn = e.target.closest('.news-cat-btn');
  if (!btn || btn.closest('#fs-news-controls')) return; // fs handled separately
  currentNewsCat = btn.dataset.cat;
  document.querySelectorAll('#news-controls .news-cat-btn').forEach(b => b.classList.toggle('active', b === btn));
  loadNews(currentNewsCat);
});

// ═══════════════════════════════════════════════════════════════
// HAND GESTURES
//   swipe (one hand)       → switch monitors left/right
//   RAISE BOTH WRISTS HIGH → toggle overview/focus
//     (replaces two-hand spread — much less accidental)
// ═══════════════════════════════════════════════════════════════
window.addEventListener('jarvis:swipe', e => {
  if (fsActive) return;
  manualSwipe(e.detail.dir === 'right' ? 'right' : 'left');
});

// The "zoom" event from hand-tracking still fires on two-hand spread;
// we now IGNORE it and use our own raise-both-wrists detection instead.
// window.addEventListener('jarvis:zoom', ...) — intentionally removed.

// Raise-both-wrists detection runs inside the onResults pipeline.
// We tap into it via a polling approach: watch for both wrists to be
// above RAISE_Y (y < 0.30 = top 30% of frame) for HOLD_MS.
let bothRaiseStart = null;
const RAISE_Y    = 0.32;   // wrist y must be above this (lower number = higher in frame)
const HOLD_MS    = 600;    // hold for 600ms to trigger — avoids accidentals
const OV_COOL_MS = 1400;
let lastOvAt     = 0;

function checkRaiseBoth(allLandmarks) {
  if (allLandmarks.length < 2) { bothRaiseStart = null; return; }
  const w1 = allLandmarks[0][0], w2 = allLandmarks[1][0];
  const raised = w1.y < RAISE_Y && w2.y < RAISE_Y;
  const now = performance.now();
  if (raised) {
    if (!bothRaiseStart) bothRaiseStart = now;
    else if (now - bothRaiseStart > HOLD_MS && now - lastOvAt > OV_COOL_MS) {
      lastOvAt = now; bothRaiseStart = null;
      toggleOverview();
      flashHint(mode === 'overview' ? 'OVERVIEW MODE' : 'FOCUS MODE');
    }
  } else {
    bothRaiseStart = null;
  }
}

// Hook into HandTracking's onResults after it loads
window.addEventListener('load', () => {
  const origOnResults = window._htOnResults; // hand-tracking.js sets this if present — fallback below
});

// Patch: hand-tracking.js fires a custom event per frame we can listen to
window.addEventListener('jarvis:handframe', e => {
  if (!fsActive && e.detail && e.detail.allLandmarks) checkRaiseBoth(e.detail.allLandmarks);
});

function flashHint(msg) {
  const el = document.getElementById('gesture-hint');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 1800);
}

// ═══════════════════════════════════════════════════════════════
// HAND CONTROL TOGGLE
// ═══════════════════════════════════════════════════════════════
function toggleHandControl() {
  const btn = document.getElementById('hand-toggle');
  if (!window.HandTracking) { btn.textContent = '🖐 HAND CONTROL: UNAVAILABLE'; return; }
  if (HandTracking.active) {
    HandTracking.stop();
    btn.textContent = '🖐 HAND CONTROL: OFF';
    btn.classList.remove('on');
  } else {
    HandTracking.start();
    btn.textContent = '🖐 HAND CONTROL: ON';
    btn.classList.add('on');
    document.getElementById('feed-placeholder')?.style.setProperty('display', 'none');
  }
}

// ═══════════════════════════════════════════════════════════════
// COSMETIC TELEMETRY + TICKER
// ═══════════════════════════════════════════════════════════════
function rand(a, b) { return Math.floor(Math.random() * (b - a) + a); }
function tickTelemetry() {
  [['cpu','fs-bar-cpu','val-cpu','fs-val-cpu'],['mem','fs-bar-mem','val-mem','fs-val-mem'],['net','fs-bar-net','val-net','fs-val-net']].forEach(([k,fb,v,fv]) => {
    const val = rand(15, 70);
    ['bar-'+k, fb].forEach(id => { const el=document.getElementById(id); if(el) el.style.width=val+'%'; });
    ['val-'+k, fv].forEach(id => { const el=document.getElementById(id); if(el) el.textContent=val+'%'; });
  });
}
setInterval(tickTelemetry, 3000);

const TICKER_ITEMS = ['LEARNED INTENTS: +3 TODAY','TUTOR CALLS: NOMINAL','SELF-SUFFICIENCY: TRENDING UP','NETWORK: STABLE','POWER DRAW: WITHIN LIMITS'];
(function initTicker() {
  const el = document.getElementById('ticker-track');
  if (el) el.innerHTML = TICKER_ITEMS.concat(TICKER_ITEMS).map(t => `<span>${t}</span>`).join('');
})();

// ═══════════════════════════════════════════════════════════════
// PERSISTENT JARVIS CHAT
// ═══════════════════════════════════════════════════════════════
const sessionId = 'wall_' + Math.random().toString(36).slice(2);
let replyTimer = null;
function showReply(text) {
  const card = document.getElementById('reply-card');
  document.getElementById('reply-text').textContent = text;
  card.classList.add('show');
  clearTimeout(replyTimer);
  replyTimer = setTimeout(() => card.classList.remove('show'), 9000);
}

function indexOf(id) { return MONITORS.findIndex(m => m.id === id); }

function routeProactively(text) {
  const lower = text.toLowerCase();
  const cat = NEWS_CATS.find(c => c !== 'general' && lower.includes(c));
  if (/\bnews\b/.test(lower) || cat) {
    focusMonitor(indexOf('news'));
    currentNewsCat = cat || 'general';
    document.querySelectorAll('.news-cat-btn').forEach(b => b.classList.toggle('active', b.dataset.cat === currentNewsCat));
    loadNews(currentNewsCat);
    return true;
  }
  if (/\bworkspace\b/.test(lower)) { focusMonitor(indexOf('workspace')); return true; }
  if (/\bblueprint\b/.test(lower)) { focusMonitor(indexOf('blueprint')); return true; }
  if (/\bcomms\b|\bphone\b|\bcall\b/.test(lower)) { focusMonitor(indexOf('comms')); return true; }
  if (/\bviewer\b|\b3d (scan|view|model)\b/.test(lower)) { focusMonitor(indexOf('viewer')); return true; }
  if (/\b(system status|main monitor|camera|telemetry)\b/.test(lower)) { focusMonitor(indexOf('monitor')); return true; }
  return false;
}

async function sendToJarvis(text) {
  routeProactively(text);
  showReply('…');
  try {
    const res = await fetch('/api/chat', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, sessionId, userName: 'Operator', userTitle: 'Sir', memories: [] }),
    });
    const data = await res.json();
    showReply(data.reply || "I'm here, Sir — go ahead.");
  } catch {
    showReply(`Server unreachable right now, Sir. I heard: "${text}".`);
  }
}

function sendCommand() {
  const input = document.getElementById('cmd-input');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  sendToJarvis(text);
}
document.getElementById('cmd-input').addEventListener('keydown', e => { if (e.key === 'Enter') sendCommand(); });

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null, isListening = false;
document.getElementById('voice-btn').addEventListener('click', () => {
  if (!SR) { showReply('Voice recognition not available in this browser, Sir. Try Chrome.'); return; }
  if (isListening) { recognition.stop(); return; }
  recognition = new SR();
  recognition.lang = 'en-US'; recognition.interimResults = false;
  recognition.onstart = () => { isListening = true; document.getElementById('voice-btn').classList.add('listening'); };
  recognition.onend   = () => { isListening = false; document.getElementById('voice-btn').classList.remove('listening'); };
  recognition.onresult = e => { const text = e.results[0][0].transcript; document.getElementById('cmd-input').value = text; sendToJarvis(text); };
  recognition.onerror = () => { isListening = false; document.getElementById('voice-btn').classList.remove('listening'); };
  recognition.start();
});

setTimeout(() => showReply('Six monitors up, Sir. Swipe to switch, raise both wrists to see them all, click any card to fullscreen.'), 1200);
</script>
<script src="hand-tracking.js"></script>
