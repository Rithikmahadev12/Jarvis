<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>J.A.R.V.I.S — COMMS</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#010c14;font-family:'Share Tech Mono',monospace;color:#a8dff5}

:root{
  --blue:#00c8ff;--blue-dim:rgba(0,200,255,0.15);--blue-glow:rgba(0,200,255,0.35);
  --amber:#ffaa00;--red:#ff3333;--green:#00ff88;--purple:#aa44ff;
  --bg:#010c14;--bg2:#021828;--text-dim:#3a6a88;--hud:'Orbitron',monospace;
}

/* ── LAYOUT ── */
#app{display:flex;width:100vw;height:100vh;position:relative}

/* ── SCANLINE ── */
.scanline{position:fixed;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,rgba(0,200,255,0.1),transparent);animation:scan 10s linear infinite;pointer-events:none;z-index:100}
@keyframes scan{from{top:-2px}to{top:100vh}}

/* ── CORNERS ── */
.corner{position:fixed;width:36px;height:36px;pointer-events:none;z-index:99}
.corner::before,.corner::after{content:'';position:absolute;background:var(--blue);opacity:0.5}
.corner::before{width:100%;height:1px;top:0}.corner::after{width:1px;height:100%;top:0}
.corner.tl{top:12px;left:12px}.corner.tr{top:12px;right:12px;transform:scaleX(-1)}
.corner.bl{bottom:12px;left:12px;transform:scaleY(-1)}.corner.br{bottom:12px;right:12px;transform:scale(-1)}

/* ── SIDEBAR — user list ── */
#sidebar{
  width:240px;flex-shrink:0;
  display:flex;flex-direction:column;
  border-right:1px solid rgba(0,200,255,0.1);
  background:rgba(1,10,20,0.9);
  z-index:10;
}
.sidebar-header{
  padding:16px 14px 12px;
  border-bottom:1px solid rgba(0,200,255,0.1);
  display:flex;flex-direction:column;gap:8px;
}
.sidebar-title{
  font-family:var(--hud);font-size:0.62rem;font-weight:700;
  letter-spacing:0.35em;color:var(--blue);
}
.sidebar-sub{font-size:0.5rem;letter-spacing:0.2em;color:var(--text-dim)}

#search-users{
  width:100%;background:rgba(0,200,255,0.04);
  border:1px solid rgba(0,200,255,0.15);
  color:var(--blue);font-family:'Share Tech Mono',monospace;
  font-size:0.65rem;padding:6px 10px;border-radius:2px;outline:none;
  letter-spacing:0.08em;
}
#search-users:focus{border-color:rgba(0,200,255,0.4)}
#search-users::placeholder{color:var(--text-dim)}

.sidebar-section-label{
  font-family:var(--hud);font-size:0.38rem;
  letter-spacing:0.28em;color:var(--text-dim);
  padding:10px 14px 4px;text-transform:uppercase;
}

#user-list{flex:1;overflow-y:auto;scrollbar-width:thin;scrollbar-color:rgba(0,200,255,0.1) transparent}
#user-list::-webkit-scrollbar{width:2px}
#user-list::-webkit-scrollbar-thumb{background:rgba(0,200,255,0.15)}

.user-item{
  display:flex;align-items:center;gap:10px;
  padding:8px 14px;cursor:pointer;
  border-left:2px solid transparent;
  transition:all 0.15s;
  border-bottom:1px solid rgba(0,200,255,0.04);
}
.user-item:hover{background:rgba(0,200,255,0.06);border-left-color:rgba(0,200,255,0.3)}
.user-item.active{background:rgba(0,200,255,0.1);border-left-color:var(--blue)}

.user-avatar{
  width:34px;height:34px;border-radius:50%;
  background:linear-gradient(135deg,rgba(0,200,255,0.25),rgba(0,80,140,0.4));
  border:1px solid rgba(0,200,255,0.3);
  display:flex;align-items:center;justify-content:center;
  font-size:0.75rem;color:var(--blue);font-weight:700;flex-shrink:0;
  position:relative;
}
.status-dot{
  position:absolute;bottom:0;right:0;
  width:9px;height:9px;border-radius:50%;
  border:2px solid var(--bg2);
}
.status-dot.online{background:var(--green);box-shadow:0 0 5px var(--green)}
.status-dot.away  {background:var(--amber)}
.status-dot.busy  {background:var(--red)}
.status-dot.offline{background:var(--text-dim)}

.user-info{flex:1;min-width:0}
.user-name{font-size:0.72rem;color:#d8f4ff;letter-spacing:0.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-status-label{font-size:0.52rem;color:var(--text-dim);letter-spacing:0.1em;margin-top:1px}
.user-unread{
  min-width:18px;height:18px;border-radius:9px;
  background:var(--blue);color:#010c14;
  font-size:0.5rem;font-weight:700;
  display:flex;align-items:center;justify-content:center;
  padding:0 4px;flex-shrink:0;font-family:var(--hud);
}

/* ── GROUP ROOMS ── */
.room-item{
  display:flex;align-items:center;gap:10px;
  padding:7px 14px;cursor:pointer;
  border-left:2px solid transparent;
  transition:all 0.15s;
  border-bottom:1px solid rgba(0,200,255,0.04);
}
.room-item:hover{background:rgba(170,68,255,0.06);border-left-color:rgba(170,68,255,0.3)}
.room-item.active{background:rgba(170,68,255,0.1);border-left-color:var(--purple)}
.room-icon{
  width:34px;height:34px;border-radius:4px;
  background:rgba(170,68,255,0.15);
  border:1px solid rgba(170,68,255,0.3);
  display:flex;align-items:center;justify-content:center;
  font-size:0.9rem;flex-shrink:0;
}
.room-name{font-size:0.7rem;color:#d8f4ff;letter-spacing:0.06em}
.room-count{font-size:0.5rem;color:var(--text-dim)}

/* ── CREATE GROUP BTN ── */
#btn-create-group{
  margin:8px 14px;width:calc(100% - 28px);
  background:rgba(170,68,255,0.08);
  border:1px solid rgba(170,68,255,0.25);
  color:rgba(170,68,255,0.8);
  font-family:var(--hud);font-size:0.42rem;
  letter-spacing:0.22em;padding:7px;
  cursor:pointer;border-radius:2px;transition:all 0.2s;
}
#btn-create-group:hover{background:rgba(170,68,255,0.15);border-color:var(--purple);color:var(--purple)}

/* ── MAIN CHAT AREA ── */
#chat-area{
  flex:1;display:flex;flex-direction:column;
  min-width:0;
}

/* ── CHAT HEADER ── */
#chat-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 20px;
  border-bottom:1px solid rgba(0,200,255,0.1);
  background:rgba(1,10,20,0.7);
  flex-shrink:0;
}
.chat-header-left{display:flex;align-items:center;gap:12px}
.chat-peer-avatar{
  width:38px;height:38px;border-radius:50%;
  background:linear-gradient(135deg,rgba(0,200,255,0.25),rgba(0,80,140,0.4));
  border:1px solid rgba(0,200,255,0.3);
  display:flex;align-items:center;justify-content:center;
  font-size:0.85rem;color:var(--blue);font-weight:700;position:relative;
}
.chat-peer-name{font-family:var(--hud);font-size:0.7rem;letter-spacing:0.2em;color:#d8f4ff}
.chat-peer-status{font-size:0.5rem;letter-spacing:0.15em;color:var(--text-dim);margin-top:2px}
.chat-header-right{display:flex;gap:8px}

.icon-btn{
  background:rgba(0,200,255,0.06);
  border:1px solid rgba(0,200,255,0.2);
  color:var(--blue);
  width:34px;height:34px;border-radius:2px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:1rem;transition:all 0.2s;
}
.icon-btn:hover{background:rgba(0,200,255,0.15);border-color:var(--blue);box-shadow:0 0 12px var(--blue-glow)}
.icon-btn.voice{border-color:rgba(0,255,136,0.3);color:var(--green)}
.icon-btn.voice:hover{background:rgba(0,255,136,0.1);border-color:var(--green)}
.icon-btn.video{border-color:rgba(0,200,255,0.3)}
.icon-btn.end-call{border-color:rgba(255,51,51,0.4);color:var(--red)}
.icon-btn.end-call:hover{background:rgba(255,51,51,0.12);border-color:var(--red)}

/* ── EMPTY STATE ── */
#empty-state{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
}
.empty-orb{
  width:80px;height:80px;border-radius:50%;
  border:1px solid rgba(0,200,255,0.15);
  display:flex;align-items:center;justify-content:center;
  font-size:2rem;
  animation:breathe 4s ease-in-out infinite;
}
@keyframes breathe{0%,100%{box-shadow:0 0 20px rgba(0,200,255,0.05)}50%{box-shadow:0 0 40px rgba(0,200,255,0.15)}}
.empty-text{font-family:var(--hud);font-size:0.5rem;letter-spacing:0.3em;color:rgba(0,200,255,0.3)}

/* ── MESSAGES ── */
#messages{
  flex:1;overflow-y:auto;padding:16px 20px;
  display:flex;flex-direction:column;gap:6px;
  scrollbar-width:thin;scrollbar-color:rgba(0,200,255,0.1) transparent;
}
#messages::-webkit-scrollbar{width:3px}
#messages::-webkit-scrollbar-thumb{background:rgba(0,200,255,0.15)}

.msg-group{display:flex;flex-direction:column;gap:2px;margin-bottom:6px}
.msg-header{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.msg-avatar{
  width:26px;height:26px;border-radius:50%;
  background:rgba(0,200,255,0.15);border:1px solid rgba(0,200,255,0.2);
  display:flex;align-items:center;justify-content:center;
  font-size:0.55rem;color:var(--blue);font-weight:700;flex-shrink:0;
}
.msg-sender{font-size:0.62rem;color:var(--blue);letter-spacing:0.1em;font-family:var(--hud)}
.msg-time{font-size:0.48rem;color:var(--text-dim)}

.msg-bubble{
  display:inline-block;max-width:75%;
  padding:8px 12px;border-radius:2px;
  font-size:0.75rem;line-height:1.55;letter-spacing:0.04em;
  animation:msgIn 0.2s ease;
}
@keyframes msgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.msg-bubble.incoming{
  background:rgba(0,200,255,0.07);
  border:1px solid rgba(0,200,255,0.12);
  border-left:2px solid rgba(0,200,255,0.4);
  color:#d8f4ff;
  align-self:flex-start;
}
.msg-bubble.outgoing{
  background:rgba(0,200,255,0.12);
  border:1px solid rgba(0,200,255,0.2);
  border-right:2px solid var(--blue);
  color:#d8f4ff;
  align-self:flex-end;
}
.msg-bubble.system{
  background:rgba(255,170,0,0.06);
  border:1px solid rgba(255,170,0,0.15);
  color:rgba(255,190,80,0.8);
  font-size:0.62rem;letter-spacing:0.1em;
  align-self:center;text-align:center;width:100%;max-width:100%;
}
.msg-row{display:flex}
.msg-row.out{justify-content:flex-end}
.msg-row.in{justify-content:flex-start}

.typing-indicator{
  display:flex;align-items:center;gap:4px;
  padding:6px 12px;font-size:0.6rem;color:var(--text-dim);
  letter-spacing:0.1em;
}
.typing-dots span{
  display:inline-block;width:4px;height:4px;border-radius:50%;
  background:var(--text-dim);margin:0 2px;
  animation:typingDot 1.2s ease-in-out infinite;
}
.typing-dots span:nth-child(2){animation-delay:0.2s}
.typing-dots span:nth-child(3){animation-delay:0.4s}
@keyframes typingDot{0%,80%,100%{transform:scale(0.6);opacity:0.3}40%{transform:scale(1);opacity:1}}

/* ── CHAT INPUT ── */
#chat-input-bar{
  display:flex;align-items:center;gap:8px;
  padding:10px 20px;
  border-top:1px solid rgba(0,200,255,0.1);
  background:rgba(1,8,18,0.9);flex-shrink:0;
}
#msg-input{
  flex:1;background:rgba(0,200,255,0.04);
  border:1px solid rgba(0,200,255,0.15);
  color:#d8f4ff;font-family:'Share Tech Mono',monospace;
  font-size:0.75rem;padding:9px 14px;border-radius:2px;
  outline:none;letter-spacing:0.05em;transition:border-color 0.2s;
}
#msg-input:focus{border-color:rgba(0,200,255,0.45)}
#msg-input::placeholder{color:var(--text-dim)}
#msg-send{
  background:rgba(0,200,255,0.1);
  border:1px solid rgba(0,200,255,0.35);
  color:var(--blue);font-family:'Orbitron',monospace;
  font-size:0.42rem;letter-spacing:0.2em;
  padding:9px 16px;cursor:pointer;border-radius:2px;
  transition:all 0.2s;white-space:nowrap;
}
#msg-send:hover{background:rgba(0,200,255,0.2);box-shadow:0 0 12px var(--blue-glow)}

/* ── CALL OVERLAY ── */
#call-overlay{
  position:fixed;inset:0;z-index:500;
  background:rgba(1,5,15,0.96);backdrop-filter:blur(8px);
  display:none;flex-direction:column;align-items:center;justify-content:center;gap:24px;
}
#call-overlay.active{display:flex}

.call-avatar{
  width:100px;height:100px;border-radius:50%;
  background:linear-gradient(135deg,rgba(0,200,255,0.2),rgba(0,80,140,0.4));
  border:2px solid rgba(0,200,255,0.4);
  display:flex;align-items:center;justify-content:center;
  font-size:2.5rem;
  box-shadow:0 0 40px rgba(0,200,255,0.2);
  animation:callPulse 2s ease-in-out infinite;
}
@keyframes callPulse{0%,100%{box-shadow:0 0 40px rgba(0,200,255,0.2)}50%{box-shadow:0 0 70px rgba(0,200,255,0.4)}}
.call-name{font-family:var(--hud);font-size:1.2rem;letter-spacing:0.4em;color:#d8f4ff}
.call-status{font-size:0.6rem;letter-spacing:0.3em;color:var(--text-dim);animation:blink 1.4s step-end infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
.call-timer{font-family:'Share Tech Mono',monospace;font-size:1.4rem;color:var(--blue);letter-spacing:0.2em}

.call-actions{display:flex;gap:20px;margin-top:8px}
.call-btn{
  width:56px;height:56px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:1.4rem;cursor:pointer;border:none;transition:all 0.2s;
}
.call-btn.accept{background:rgba(0,255,136,0.2);border:2px solid var(--green);color:var(--green)}
.call-btn.accept:hover{background:rgba(0,255,136,0.35);box-shadow:0 0 20px rgba(0,255,136,0.4)}
.call-btn.reject,.call-btn.hangup{background:rgba(255,51,51,0.2);border:2px solid var(--red);color:var(--red)}
.call-btn.reject:hover,.call-btn.hangup:hover{background:rgba(255,51,51,0.35);box-shadow:0 0 20px rgba(255,51,51,0.4)}
.call-btn.mute{background:rgba(0,200,255,0.1);border:2px solid rgba(0,200,255,0.4);color:var(--blue)}
.call-btn.mute.active{background:rgba(255,51,51,0.15);border-color:rgba(255,51,51,0.5);color:var(--red)}

/* Video streams */
#video-container{
  position:relative;width:560px;height:315px;
  background:#000;border:1px solid rgba(0,200,255,0.2);border-radius:2px;
  overflow:hidden;display:none;
}
#video-container.active{display:block}
#remote-video{width:100%;height:100%;object-fit:cover}
#local-video{
  position:absolute;bottom:12px;right:12px;
  width:140px;height:80px;object-fit:cover;
  border:1px solid rgba(0,200,255,0.4);border-radius:2px;
  z-index:2;
}

/* ── INCOMING CALL TOAST ── */
#incoming-call{
  position:fixed;top:20px;right:20px;z-index:600;
  background:rgba(1,10,20,0.97);
  border:1px solid rgba(0,255,136,0.4);
  box-shadow:0 0 30px rgba(0,255,136,0.2);
  border-radius:3px;padding:16px 20px;
  display:none;flex-direction:column;gap:12px;
  min-width:260px;animation:slideIn 0.25s ease;
}
#incoming-call.active{display:flex}
@keyframes slideIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
.incoming-header{font-family:var(--hud);font-size:0.42rem;letter-spacing:0.28em;color:var(--green);animation:blink 1s step-end infinite}
.incoming-name{font-size:0.9rem;color:#d8f4ff;letter-spacing:0.08em}
.incoming-type{font-size:0.55rem;color:var(--text-dim);letter-spacing:0.15em}
.incoming-actions{display:flex;gap:8px}
.inc-btn{
  flex:1;padding:8px;border:none;border-radius:2px;
  font-family:var(--hud);font-size:0.42rem;letter-spacing:0.18em;
  cursor:pointer;transition:all 0.15s;
}
.inc-btn.accept{background:rgba(0,255,136,0.15);border:1px solid rgba(0,255,136,0.4);color:var(--green)}
.inc-btn.accept:hover{background:rgba(0,255,136,0.25)}
.inc-btn.reject{background:rgba(255,51,51,0.1);border:1px solid rgba(255,51,51,0.3);color:var(--red)}
.inc-btn.reject:hover{background:rgba(255,51,51,0.2)}

/* ── GROUP CREATE MODAL ── */
#group-modal{
  position:fixed;inset:0;z-index:400;
  background:rgba(1,5,15,0.88);backdrop-filter:blur(6px);
  display:none;align-items:center;justify-content:center;
}
#group-modal.active{display:flex}
.modal-box{
  background:rgba(2,12,24,0.99);
  border:1px solid rgba(170,68,255,0.35);
  box-shadow:0 0 50px rgba(170,68,255,0.12);
  border-radius:3px;padding:24px 28px;
  width:360px;display:flex;flex-direction:column;gap:14px;
}
.modal-title{font-family:var(--hud);font-size:0.65rem;letter-spacing:0.28em;color:var(--purple)}
.modal-input{
  width:100%;background:rgba(170,68,255,0.06);
  border:1px solid rgba(170,68,255,0.2);
  color:#d8f4ff;font-family:'Share Tech Mono',monospace;
  font-size:0.75rem;padding:8px 12px;border-radius:2px;outline:none;
}
.modal-input:focus{border-color:rgba(170,68,255,0.5)}
.member-chips{display:flex;flex-wrap:wrap;gap:5px;min-height:32px}
.chip{
  background:rgba(170,68,255,0.12);border:1px solid rgba(170,68,255,0.3);
  color:var(--purple);font-size:0.6rem;letter-spacing:0.1em;
  padding:3px 10px;border-radius:2px;display:flex;align-items:center;gap:6px;
}
.chip-remove{cursor:pointer;opacity:0.6;font-size:0.8rem}
.chip-remove:hover{opacity:1}
.member-select{
  width:100%;background:rgba(0,200,255,0.04);
  border:1px solid rgba(0,200,255,0.15);
  color:#d8f4ff;font-family:'Share Tech Mono',monospace;
  font-size:0.7rem;padding:7px 10px;border-radius:2px;outline:none;
}
.modal-actions{display:flex;gap:8px}
.modal-btn{
  flex:1;padding:9px;border:none;border-radius:2px;
  font-family:var(--hud);font-size:0.45rem;letter-spacing:0.2em;cursor:pointer;
}
.modal-btn.create{background:rgba(170,68,255,0.15);border:1px solid rgba(170,68,255,0.4);color:var(--purple)}
.modal-btn.create:hover{background:rgba(170,68,255,0.25)}
.modal-btn.cancel{background:transparent;border:1px solid rgba(255,255,255,0.1);color:var(--text-dim)}

/* ── YOU ARE badge ── */
#you-badge{
  display:flex;align-items:center;gap:8px;
  padding:10px 14px;
  border-top:1px solid rgba(0,200,255,0.08);
  background:rgba(0,200,255,0.03);
  flex-shrink:0;
}
.you-avatar{
  width:30px;height:30px;border-radius:50%;
  background:rgba(0,200,255,0.15);border:1px solid rgba(0,200,255,0.3);
  display:flex;align-items:center;justify-content:center;
  font-size:0.65rem;color:var(--blue);font-weight:700;
}
.you-info{flex:1;min-width:0}
.you-name{font-size:0.65rem;color:#d8f4ff;letter-spacing:0.06em}
.you-title{font-size:0.46rem;color:var(--text-dim)}
#status-select{
  background:transparent;border:none;color:var(--text-dim);
  font-family:'Share Tech Mono',monospace;font-size:0.52rem;cursor:pointer;outline:none;
}
#status-select option{background:var(--bg2)}

/* ── NOTIFICATION BADGE ── */
#notif-badge{
  position:fixed;bottom:20px;right:20px;z-index:300;
  background:rgba(0,200,255,0.1);border:1px solid rgba(0,200,255,0.3);
  border-radius:2px;padding:7px 14px;font-size:0.6rem;
  color:var(--blue);letter-spacing:0.1em;
  display:none;animation:msgIn 0.2s ease;
}

/* ── BACK TO JARVIS BTN ── */
#back-btn{
  position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:50;
  background:rgba(0,200,255,0.07);border:1px solid rgba(0,200,255,0.2);
  color:var(--text-dim);font-family:var(--hud);font-size:0.38rem;
  letter-spacing:0.2em;padding:5px 12px;cursor:pointer;border-radius:2px;transition:all 0.2s;
}
#back-btn:hover{border-color:var(--blue);color:var(--blue)}

/* ── CALL RING ANIMATION ── */
#ring-anim{display:none;flex-direction:column;align-items:center;gap:8px}
#ring-anim.active{display:flex}
.ring-wave{
  width:120px;height:120px;border-radius:50%;
  border:1px solid rgba(0,255,136,0.3);
  position:absolute;
  animation:ringWave 2s ease-out infinite;
}
.ring-wave:nth-child(2){animation-delay:0.5s}
.ring-wave:nth-child(3){animation-delay:1s}
@keyframes ringWave{from{transform:scale(0.8);opacity:0.8}to{transform:scale(2);opacity:0}}
</style>
</head>
<body>
<div class="scanline"></div>
<div class="corner tl"></div><div class="corner tr"></div>
<div class="corner bl"></div><div class="corner br"></div>

<!-- Back to JARVIS -->
<button id="back-btn" onclick="window.location.href='/'">← BACK TO J.A.R.V.I.S</button>

<!-- Incoming call toast -->
<div id="incoming-call">
  <div class="incoming-header">⬡ INCOMING CALL</div>
  <div class="incoming-name" id="inc-caller-name">—</div>
  <div class="incoming-type" id="inc-call-type">VIDEO CALL</div>
  <div class="incoming-actions">
    <button class="inc-btn accept" onclick="answerCall(true)">✓ ANSWER</button>
    <button class="inc-btn reject" onclick="answerCall(false)">✕ DECLINE</button>
  </div>
</div>

<!-- Call overlay -->
<div id="call-overlay">
  <div id="ring-anim">
    <div class="ring-wave"></div><div class="ring-wave"></div><div class="ring-wave"></div>
  </div>
  <div id="video-container">
    <video id="remote-video" autoplay playsinline></video>
    <video id="local-video"  autoplay muted playsinline></video>
  </div>
  <div class="call-avatar" id="call-overlay-avatar">👤</div>
  <div class="call-name"   id="call-overlay-name">—</div>
  <div class="call-status" id="call-overlay-status">CONNECTING…</div>
  <div class="call-timer"  id="call-timer" style="display:none">00:00</div>
  <div class="call-actions">
    <button class="call-btn mute"   id="btn-mute"   onclick="toggleMute()">🎙</button>
    <button class="call-btn hangup" onclick="hangUp()">📵</button>
    <button class="call-btn mute"   id="btn-cam"    onclick="toggleCam()">📷</button>
  </div>
</div>

<!-- Group create modal -->
<div id="group-modal">
  <div class="modal-box">
    <div class="modal-title">⬡ CREATE GROUP CHANNEL</div>
    <input class="modal-input" id="group-name-input" placeholder="Channel name…" maxlength="32"/>
    <div class="member-chips" id="member-chips"></div>
    <select class="member-select" id="member-select" onchange="addMemberFromSelect()">
      <option value="">+ Add member…</option>
    </select>
    <div class="modal-actions">
      <button class="modal-btn create" onclick="confirmCreateGroup()">CREATE</button>
      <button class="modal-btn cancel" onclick="closeGroupModal()">CANCEL</button>
    </div>
  </div>
</div>

<!-- Main layout -->
<div id="app">

  <!-- Sidebar -->
  <div id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-title">COMMS</div>
      <div class="sidebar-sub">J.A.R.V.I.S NETWORK</div>
      <input id="search-users" placeholder="Search users…" oninput="filterUsers(this.value)"/>
    </div>

    <div class="sidebar-section-label">● ONLINE USERS</div>
    <div id="user-list"></div>

    <div class="sidebar-section-label">⬡ GROUP CHANNELS</div>
    <div id="room-list"></div>
    <button id="btn-create-group" onclick="openGroupModal()">+ NEW GROUP CHANNEL</button>

    <div id="you-badge">
      <div class="you-avatar" id="you-avatar">?</div>
      <div class="you-info">
        <div class="you-name" id="you-name">—</div>
        <div class="you-title" id="you-title">—</div>
      </div>
      <select id="status-select" onchange="updateStatus(this.value)">
        <option value="online">● Online</option>
        <option value="away">◌ Away</option>
        <option value="busy">■ Busy</option>
        <option value="dnd">⊘ DND</option>
      </select>
    </div>
  </div>

  <!-- Chat area -->
  <div id="chat-area">
    <div id="chat-header" style="display:none">
      <div class="chat-header-left">
        <div class="chat-peer-avatar" id="chat-peer-avatar">?</div>
        <div>
          <div class="chat-peer-name" id="chat-peer-name">—</div>
          <div class="chat-peer-status" id="chat-peer-status">—</div>
        </div>
      </div>
      <div class="chat-header-right">
        <button class="icon-btn voice" title="Voice call" onclick="startCall('voice')">📞</button>
        <button class="icon-btn video" title="Video call" onclick="startCall('video')">📹</button>
      </div>
    </div>

    <div id="empty-state">
      <div class="empty-orb">⬡</div>
      <div class="empty-text">SELECT A USER TO BEGIN</div>
      <div style="font-size:0.52rem;color:var(--text-dim);letter-spacing:0.1em">JARVIS SECURE COMMS</div>
    </div>

    <div id="messages" style="display:none"></div>

    <div id="chat-input-bar" style="display:none">
      <input id="msg-input" placeholder="Message…" maxlength="2000"
             onkeydown="handleMsgKey(event)"
             oninput="handleTyping()"/>
      <button id="msg-send" onclick="sendMessage()">SEND ⏎</button>
    </div>
  </div>
</div>

<div id="notif-badge"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
// ═══════════════════════════════════════════════════════════════
// J.A.R.V.I.S COMMS — CLIENT v1.0
// ═══════════════════════════════════════════════════════════════

const socket = io();

// ── STATE ──────────────────────────────────────────────────────
const state = {
  me:           null,   // { username, title }
  users:        [],     // online users
  activeRoom:   null,   // current room id or dm target
  activePeer:   null,   // username of current peer (dm) or null (group)
  rooms:        [],     // group rooms
  unread:       {},     // { username → count }
  pendingCall:  null,   // incoming call data
  activeCall:   null,   // { callId, peer, type }
  callTimer:    null,
  callSeconds:  0,
  pc:           null,   // RTCPeerConnection
  localStream:  null,
  muted:        false,
  camOff:       false,
  typing:       {},     // { roomId → Set<username> }
  typingTimer:  null,
  groupMembers: [],     // for group create UI
};

// ── BOOT — read identity from JARVIS session ───────────────────
async function boot() {
  try {
    const res  = await fetch('/api/extension/status');
    const data = await res.json();
    if (data.user) {
      state.me = { username: data.user, title: data.userTitle || 'Sir' };
      joinComms();
    } else {
      // Not logged into JARVIS — redirect
      window.location.href = '/';
    }
  } catch {
    // Try localStorage fallback
    const profile = JSON.parse(localStorage.getItem('jarvis_profile') || 'null');
    if (profile?.name) {
      state.me = { username: profile.name, title: profile.title || 'Sir' };
      joinComms();
    } else {
      window.location.href = '/';
    }
  }
}

function joinComms() {
  socket.emit('user:join', {
    username: state.me.username,
    title:    state.me.title,
  });
  renderYouBadge();
}

// ── YOU BADGE ──────────────────────────────────────────────────
function renderYouBadge() {
  if (!state.me) return;
  document.getElementById('you-name').textContent  = state.me.username.toUpperCase();
  document.getElementById('you-title').textContent = state.me.title;
  document.getElementById('you-avatar').textContent = state.me.username.charAt(0).toUpperCase();
}

// ── SOCKET EVENTS ──────────────────────────────────────────────
socket.on('user:joined', ({ you, rooms, recentMessages }) => {
  state.rooms = rooms;
  renderRoomList();
});

socket.on('users:list', (users) => {
  state.users = users.filter(u => u.username !== state.me?.username);
  renderUserList();
  updateMemberSelect();
});

socket.on('message:received', (msg) => {
  handleIncomingMessage(msg);
});

socket.on('group:created', ({ room, message }) => {
  // Add room to local list if not there
  if (!state.rooms.find(r => r.id === room.id)) {
    state.rooms.push({ ...room });
  }
  renderRoomList();
  showNotif(`Group "${room.name}" created`);
});

socket.on('room:update', ({ room }) => {
  const idx = state.rooms.findIndex(r => r.id === room.id);
  if (idx >= 0) state.rooms[idx] = room; else state.rooms.push(room);
  renderRoomList();
});

socket.on('typing:update', ({ roomId, username, typing }) => {
  if (!state.typing[roomId]) state.typing[roomId] = new Set();
  if (typing) state.typing[roomId].add(username);
  else state.typing[roomId].delete(username);
  if (roomId === state.activeRoom) renderTyping(roomId);
});

// ── CALL EVENTS ────────────────────────────────────────────────
socket.on('call:incoming', ({ callId, from, fromTitle, callType }) => {
  state.pendingCall = { callId, from, callType };
  document.getElementById('inc-caller-name').textContent = from.toUpperCase();
  document.getElementById('inc-call-type').textContent   = callType === 'video' ? '📹 VIDEO CALL' : '📞 VOICE CALL';
  document.getElementById('incoming-call').classList.add('active');

  // Notification
  if ('Notification' in window && Notification.permission === 'granted') {
    new Notification(`⬡ INCOMING ${callType.toUpperCase()} CALL`, { body: `From ${from}` });
  }
  notifTone();
});

socket.on('call:ringing', ({ callId, to }) => {
  showCallOverlay(to, 'video', 'RINGING…');
  document.getElementById('ring-anim').classList.add('active');
});

socket.on('call:accepted', async ({ callId, by }) => {
  document.getElementById('ring-anim').classList.remove('active');
  document.getElementById('call-overlay-status').textContent = 'CONNECTED';
  startCallTimer();
  await startWebRTC(by, true); // we are the caller
});

socket.on('call:rejected', ({ callId, by }) => {
  showNotif(`${by} declined the call`);
  endCallUI();
});

socket.on('call:ended', ({ callId, by }) => {
  showNotif(`Call ended by ${by}`);
  endCallUI();
});

// WebRTC signaling
socket.on('call:offer', async ({ callId, from, sdp }) => {
  if (!state.pc) await startWebRTC(from, false);
  await state.pc.setRemoteDescription(new RTCSessionDescription(sdp));
  const answer = await state.pc.createAnswer();
  await state.pc.setLocalDescription(answer);
  socket.emit('call:sdp-answer', { callId, to: from, sdp: answer });
});

socket.on('call:sdp-answer', async ({ sdp }) => {
  if (state.pc) await state.pc.setRemoteDescription(new RTCSessionDescription(sdp));
});

socket.on('call:ice-candidate', async ({ candidate }) => {
  if (state.pc && candidate) {
    try { await state.pc.addIceCandidate(new RTCIceCandidate(candidate)); } catch {}
  }
});

// ── RENDER USER LIST ───────────────────────────────────────────
function renderUserList(filter = '') {
  const list = document.getElementById('user-list');
  const filtered = state.users.filter(u =>
    !filter || u.username.toLowerCase().includes(filter.toLowerCase())
  );

  if (filtered.length === 0) {
    list.innerHTML = `<div style="padding:14px;font-size:0.58rem;color:var(--text-dim);text-align:center;letter-spacing:0.1em">NO OTHER USERS ONLINE</div>`;
    return;
  }

  list.innerHTML = filtered.map(u => {
    const isActive = state.activePeer === u.username && !state.activeRoom?.startsWith('group');
    const unread   = state.unread[u.username] || 0;
    const initial  = u.username.charAt(0).toUpperCase();
    const statusLabel = { online: '● ONLINE', away: '◌ AWAY', busy: '■ BUSY', dnd: '⊘ DND', offline: '○ OFFLINE' }[u.status] || '';
    return `<div class="user-item ${isActive ? 'active' : ''}" onclick="openDM('${u.username}')">
      <div class="user-avatar">
        ${initial}<div class="status-dot ${u.status || 'online'}"></div>
      </div>
      <div class="user-info">
        <div class="user-name">${u.username.toUpperCase()}</div>
        <div class="user-status-label">${u.title || ''} · ${statusLabel}</div>
      </div>
      ${unread ? `<div class="user-unread">${unread}</div>` : ''}
    </div>`;
  }).join('');
}

function filterUsers(val) { renderUserList(val); }

// ── RENDER ROOM LIST ───────────────────────────────────────────
function renderRoomList() {
  const list = document.getElementById('room-list');
  const groups = state.rooms.filter(r => r.type === 'group');
  if (groups.length === 0) {
    list.innerHTML = `<div style="padding:10px 14px;font-size:0.55rem;color:var(--text-dim);letter-spacing:0.08em">No channels yet</div>`;
    return;
  }
  list.innerHTML = groups.map(r => {
    const isActive = state.activeRoom === r.id;
    const memberCount = Array.isArray(r.members) ? r.members.length : (r.members?.size || 0);
    return `<div class="room-item ${isActive ? 'active' : ''}" onclick="openRoom('${r.id}')">
      <div class="room-icon">⬡</div>
      <div class="user-info">
        <div class="room-name">${r.name.toUpperCase()}</div>
        <div class="room-count">${memberCount} MEMBERS</div>
      </div>
    </div>`;
  }).join('');
}

// ── OPEN DM ────────────────────────────────────────────────────
function openDM(username) {
  const dmId = [state.me.username, username].sort().join('::');
  state.activePeer = username;
  state.activeRoom = dmId;
  state.unread[username] = 0;

  // Clear header
  const peer = state.users.find(u => u.username === username) || { username, status: 'offline' };
  showChatHeader(username, peer.status, peer.title);
  showChatArea(true, false);
  renderMessages(dmId);
  renderUserList();

  // Request history
  socket.emit('messages:history', { roomId: dmId });
}

socket.on('messages:history', ({ roomId, messages }) => {
  if (roomId !== state.activeRoom) return;
  const el = document.getElementById('messages');
  el.innerHTML = '';
  for (const msg of messages) appendMessage(msg);
  el.scrollTop = el.scrollHeight;
});

// ── OPEN GROUP ROOM ────────────────────────────────────────────
function openRoom(roomId) {
  const room = state.rooms.find(r => r.id === roomId);
  if (!room) return;
  state.activePeer = null;
  state.activeRoom = roomId;

  showChatHeader(room.name, `${Array.isArray(room.members) ? room.members.length : 0} members`, 'GROUP');
  showChatArea(true, true); // true = hide call buttons for group (simplification)
  renderMessages(roomId);
  renderRoomList();

  socket.emit('messages:history', { roomId });
}

function showChatHeader(name, statusText, titleOrType) {
  document.getElementById('chat-header').style.display = 'flex';
  document.getElementById('empty-state').style.display = 'none';
  document.getElementById('chat-peer-avatar').textContent = name.charAt(0).toUpperCase();
  document.getElementById('chat-peer-name').textContent   = name.toUpperCase();
  document.getElementById('chat-peer-status').textContent = (titleOrType + ' · ' + statusText).toUpperCase();
}

function showChatArea(show, isGroup) {
  document.getElementById('messages').style.display         = show ? 'flex' : 'none';
  document.getElementById('chat-input-bar').style.display   = show ? 'flex' : 'none';
  // Show/hide call buttons
  const callBtns = document.querySelectorAll('.icon-btn.voice, .icon-btn.video');
  callBtns.forEach(b => b.style.display = (isGroup ? 'none' : 'flex'));
}

// ── MESSAGES ───────────────────────────────────────────────────
const _renderedIds = new Set();

function renderMessages(roomId) {
  document.getElementById('messages').innerHTML = '';
  _renderedIds.clear();
}

function appendMessage(msg) {
  if (_renderedIds.has(msg.id)) return;
  _renderedIds.add(msg.id);
  const el = document.getElementById('messages');
  const isMe = msg.from === state.me?.username;

  if (msg.type === 'system') {
    const div = document.createElement('div');
    div.className = 'msg-row';
    div.innerHTML = `<div class="msg-bubble system">${escHtml(msg.text)}</div>`;
    el.appendChild(div);
  } else {
    const div = document.createElement('div');
    div.className = `msg-row ${isMe ? 'out' : 'in'}`;
    const time = new Date(msg.ts).toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit', hour12:true });
    div.innerHTML = `
      <div style="display:flex;flex-direction:column;align-items:${isMe?'flex-end':'flex-start'};gap:2px;max-width:75%">
        ${!isMe ? `<div style="display:flex;align-items:center;gap:6px;margin-bottom:2px">
          <div class="msg-avatar">${escHtml(msg.from.charAt(0).toUpperCase())}</div>
          <span class="msg-sender">${escHtml(msg.from.toUpperCase())}</span>
          <span class="msg-time">${time}</span>
        </div>` : `<span class="msg-time" style="text-align:right">${time}</span>`}
        <div class="msg-bubble ${isMe ? 'outgoing' : 'incoming'}">${escHtml(msg.text)}</div>
      </div>`;
    el.appendChild(div);
  }
  el.scrollTop = el.scrollHeight;
}

function handleIncomingMessage(msg) {
  // Track unread
  if (msg.from !== state.me?.username) {
    const isCurrentRoom = state.activeRoom === msg.roomId;
    if (!isCurrentRoom) {
      state.unread[msg.from] = (state.unread[msg.from] || 0) + 1;
      renderUserList();
      showNotif(`${msg.from}: ${msg.text.slice(0, 40)}${msg.text.length > 40 ? '…' : ''}`);
      notifTone();
    }
  }
  if (state.activeRoom === msg.roomId) {
    appendMessage(msg);
  }
}

// ── SEND MESSAGE ───────────────────────────────────────────────
function sendMessage() {
  const input = document.getElementById('msg-input');
  const text  = input.value.trim();
  if (!text || !state.activeRoom) return;
  input.value = '';

  if (state.activePeer) {
    // DM
    socket.emit('message:send', { to: state.activePeer, text });
    appendMessage({ id: 'tmp-' + Date.now(), roomId: state.activeRoom, from: state.me.username, text, type: 'text', ts: Date.now() });
  } else {
    // Group
    socket.emit('message:group', { roomId: state.activeRoom, text });
    appendMessage({ id: 'tmp-' + Date.now(), roomId: state.activeRoom, from: state.me.username, text, type: 'text', ts: Date.now() });
  }

  // Stop typing
  socket.emit('typing:stop', { roomId: state.activeRoom });
  clearTimeout(state.typingTimer);
  state.typingTimer = null;
}

function handleMsgKey(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } }

// ── TYPING ────────────────────────────────────────────────────
function handleTyping() {
  if (!state.activeRoom) return;
  if (!state.typingTimer) socket.emit('typing:start', { roomId: state.activeRoom });
  clearTimeout(state.typingTimer);
  state.typingTimer = setTimeout(() => {
    socket.emit('typing:stop', { roomId: state.activeRoom });
    state.typingTimer = null;
  }, 2000);
}

function renderTyping(roomId) {
  const typists = [...(state.typing[roomId] || [])].filter(u => u !== state.me?.username);
  let indicator = document.getElementById('typing-indicator-el');
  if (!typists.length) { if (indicator) indicator.remove(); return; }
  if (!indicator) {
    indicator = document.createElement('div');
    indicator.id = 'typing-indicator-el';
    indicator.className = 'typing-indicator';
    document.getElementById('messages').appendChild(indicator);
  }
  indicator.innerHTML = `<span>${typists.join(', ')} ${typists.length > 1 ? 'are' : 'is'} typing</span>
    <span class="typing-dots"><span></span><span></span><span></span></span>`;
}

// ── GROUP CREATE ───────────────────────────────────────────────
function openGroupModal() {
  state.groupMembers = [];
  document.getElementById('group-name-input').value = '';
  document.getElementById('member-chips').innerHTML = '';
  updateMemberSelect();
  document.getElementById('group-modal').classList.add('active');
}

function closeGroupModal() { document.getElementById('group-modal').classList.remove('active'); }

function updateMemberSelect() {
  const sel = document.getElementById('member-select');
  if (!sel) return;
  const existing = new Set(state.groupMembers);
  sel.innerHTML = '<option value="">+ Add member…</option>' +
    state.users.filter(u => !existing.has(u.username))
               .map(u => `<option value="${escHtml(u.username)}">${escHtml(u.username.toUpperCase())}</option>`)
               .join('');
}

function addMemberFromSelect() {
  const sel = document.getElementById('member-select');
  const val = sel.value;
  if (!val || state.groupMembers.includes(val)) { sel.value = ''; return; }
  state.groupMembers.push(val);
  renderMemberChips();
  updateMemberSelect();
  sel.value = '';
}

function renderMemberChips() {
  document.getElementById('member-chips').innerHTML =
    state.groupMembers.map(m => `<div class="chip">${escHtml(m.toUpperCase())}<span class="chip-remove" onclick="removeMember('${m}')">✕</span></div>`).join('');
}

function removeMember(name) {
  state.groupMembers = state.groupMembers.filter(m => m !== name);
  renderMemberChips();
  updateMemberSelect();
}

function confirmCreateGroup() {
  const name = document.getElementById('group-name-input').value.trim();
  if (!name) { document.getElementById('group-name-input').focus(); return; }
  socket.emit('group:create', { name, members: state.groupMembers });
  closeGroupModal();
}

// ── STATUS ────────────────────────────────────────────────────
function updateStatus(status) { socket.emit('user:status', { status }); }

// ── CALLS ─────────────────────────────────────────────────────
function startCall(type) {
  if (!state.activePeer) return;
  state.activeCall = { callId: null, peer: state.activePeer, type };
  socket.emit('call:initiate', { to: state.activePeer, callType: type });
}

function answerCall(accepted) {
  document.getElementById('incoming-call').classList.remove('active');
  if (!state.pendingCall) return;
  const { callId, from, callType } = state.pendingCall;

  socket.emit('call:answer', { callId, accepted });

  if (accepted) {
    state.activeCall = { callId, peer: from, type: callType };
    showCallOverlay(from, callType, 'CONNECTING…');
    startCallTimer();
    startWebRTC(from, false);
  }
  state.pendingCall = null;
}

async function startWebRTC(peer, isCaller) {
  const iceServers = [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }];
  state.pc = new RTCPeerConnection({ iceServers });

  state.pc.onicecandidate = (e) => {
    if (e.candidate) socket.emit('call:ice-candidate', { callId: state.activeCall?.callId, to: peer, candidate: e.candidate });
  };
  state.pc.ontrack = (e) => {
    document.getElementById('remote-video').srcObject = e.streams[0];
    document.getElementById('video-container').classList.add('active');
    document.getElementById('ring-anim').classList.remove('active');
    document.getElementById('call-overlay-status').textContent = 'CONNECTED';
  };

  try {
    const constraints = state.activeCall?.type === 'video'
      ? { audio: true, video: { width: 1280, height: 720 } }
      : { audio: true, video: false };
    state.localStream = await navigator.mediaDevices.getUserMedia(constraints);
    document.getElementById('local-video').srcObject = state.localStream;
    state.localStream.getTracks().forEach(t => state.pc.addTrack(t, state.localStream));
    if (state.activeCall?.type === 'video') document.getElementById('video-container').classList.add('active');
  } catch (e) { console.warn('[COMMS] Media error:', e.message); }

  if (isCaller) {
    const offer = await state.pc.createOffer();
    await state.pc.setLocalDescription(offer);
    socket.emit('call:offer', { callId: state.activeCall?.callId, to: peer, sdp: offer });
  }
}

function showCallOverlay(peer, type, status) {
  document.getElementById('call-overlay').classList.add('active');
  document.getElementById('call-overlay-avatar').textContent = peer.charAt(0).toUpperCase();
  document.getElementById('call-overlay-name').textContent   = peer.toUpperCase();
  document.getElementById('call-overlay-status').textContent = status;
}

function endCallUI() {
  document.getElementById('call-overlay').classList.remove('active');
  document.getElementById('video-container').classList.remove('active');
  document.getElementById('ring-anim').classList.remove('active');
  document.getElementById('call-timer').style.display = 'none';
  clearInterval(state.callTimer);
  state.callTimer = null;
  state.callSeconds = 0;
  if (state.pc) { state.pc.close(); state.pc = null; }
  if (state.localStream) { state.localStream.getTracks().forEach(t => t.stop()); state.localStream = null; }
  state.activeCall = null;
}

function hangUp() {
  if (state.activeCall) {
    socket.emit('call:end', { callId: state.activeCall.callId, to: state.activeCall.peer });
  }
  endCallUI();
}

function startCallTimer() {
  state.callSeconds = 0;
  document.getElementById('call-timer').style.display = 'block';
  state.callTimer = setInterval(() => {
    state.callSeconds++;
    const m = Math.floor(state.callSeconds / 60);
    const s = state.callSeconds % 60;
    document.getElementById('call-timer').textContent =
      String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
  }, 1000);
}

function toggleMute() {
  state.muted = !state.muted;
  if (state.localStream) state.localStream.getAudioTracks().forEach(t => t.enabled = !state.muted);
  const btn = document.getElementById('btn-mute');
  btn.textContent = state.muted ? '🔇' : '🎙';
  btn.classList.toggle('active', state.muted);
}

function toggleCam() {
  state.camOff = !state.camOff;
  if (state.localStream) state.localStream.getVideoTracks().forEach(t => t.enabled = !state.camOff);
  const btn = document.getElementById('btn-cam');
  btn.textContent = state.camOff ? '📷' : '📷';
  btn.classList.toggle('active', state.camOff);
}

// ── NOTIFICATIONS ─────────────────────────────────────────────
function showNotif(text, dur = 3500) {
  const el = document.getElementById('notif-badge');
  el.textContent = text;
  el.style.display = 'block';
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.style.display = 'none'; }, dur);
}

function notifTone() {
  try {
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain();
    o.connect(g); g.connect(ac.destination);
    o.type = 'sine'; o.frequency.value = 880;
    g.gain.setValueAtTime(0.1, ac.currentTime);
    g.gain.linearRampToValueAtTime(0, ac.currentTime + 0.3);
    o.start(); o.stop(ac.currentTime + 0.35);
  } catch {}
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── BOOT ──────────────────────────────────────────────────────
if ('Notification' in window && Notification.permission === 'default') {
  Notification.requestPermission();
}
boot();
function checkAutoCall() {
  const params = new URLSearchParams(window.location.search);
  const callTarget = params.get('call');
  if (!callTarget) return;
  const attempt = setInterval(() => {
    const match = state.users.find(u => u.username.toLowerCase().includes(callTarget.toLowerCase()));
    if (match) {
      clearInterval(attempt);
      openDM(match.username);
      setTimeout(() => startCall('video'), 800);
    }
  }, 800);
  setTimeout(() => clearInterval(attempt), 10000);
}
setTimeout(checkAutoCall, 2000);
</script>
