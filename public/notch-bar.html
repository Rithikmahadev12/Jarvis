<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>J.A.R.V.I.S — Notch</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&family=Orbitron:wght@400;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: transparent;
      overflow: hidden;
      width: 100%; height: 100%;
      font-family: 'Rajdhani', system-ui, sans-serif;
      -webkit-app-region: no-drag;
    }

    /* ── ROOT PILL ── */
    #notch {
      position: fixed;
      top: 0; left: 50%;
      transform: translateX(-50%);
      width: 480px;
      z-index: 999999;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── COLLAPSED PILL (resting state) ── */
    #pill-collapsed {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(6, 10, 18, 0.92);
      border: 1px solid rgba(0, 200, 255, 0.3);
      border-top: none;
      border-radius: 0 0 24px 24px;
      padding: 7px 18px 9px;
      cursor: pointer;
      backdrop-filter: blur(20px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.6), 0 0 0 1px rgba(0,200,255,0.08) inset;
      transition: all 0.25s ease;
      -webkit-app-region: drag;
      user-select: none;
      min-width: 160px;
    }
    #pill-collapsed:hover {
      background: rgba(8, 14, 26, 0.96);
      border-color: rgba(0, 200, 255, 0.55);
      box-shadow: 0 8px 40px rgba(0,0,0,0.7), 0 0 20px rgba(0,200,255,0.12);
    }
    .pill-orb {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: #37d67a;
      flex-shrink: 0;
      transition: background 0.3s, box-shadow 0.3s;
    }
    .pill-orb.listening { background: #3aa0ff; box-shadow: 0 0 8px #3aa0ff; animation: pulse-orb 1s infinite; }
    .pill-orb.thinking  { background: #ff9f1c; box-shadow: 0 0 8px #ff9f1c; animation: pulse-orb 0.6s infinite; }
    .pill-orb.speaking  { background: #a855f7; box-shadow: 0 0 8px #a855f7; animation: pulse-orb 0.4s infinite; }
    @keyframes pulse-orb { 50% { opacity: 0.35; } }

    #pill-status-text {
      font-size: 12px;
      font-weight: 600;
      color: rgba(200, 230, 255, 0.8);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      white-space: nowrap;
      -webkit-app-region: no-drag;
    }
    .pill-mic-icon {
      margin-left: auto;
      opacity: 0.5;
      font-size: 11px;
      -webkit-app-region: no-drag;
    }

    /* ── EXPANDED PANEL ── */
    #pill-expanded {
      display: none;
      flex-direction: column;
      width: 480px;
      background: rgba(6, 10, 18, 0.97);
      border: 1px solid rgba(0, 200, 255, 0.3);
      border-top: none;
      border-radius: 0 0 20px 20px;
      overflow: hidden;
      backdrop-filter: blur(24px);
      box-shadow: 0 16px 60px rgba(0,0,0,0.8), 0 0 0 1px rgba(0,200,255,0.06) inset;
      animation: slide-down 0.2s ease forwards;
    }
    @keyframes slide-down { from { opacity:0; transform:translateY(-8px); } to { opacity:1; transform:translateY(0); } }
    #pill-expanded.open { display: flex; }

    /* header bar inside expanded */
    .exp-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px 8px;
      border-bottom: 1px solid rgba(0,200,255,0.12);
      -webkit-app-region: drag;
    }
    .exp-header-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 11px;
      font-weight: 700;
      color: rgba(140,200,255,0.7);
      letter-spacing: 0.12em;
      flex: 1;
      -webkit-app-region: no-drag;
    }
    .exp-close-btn {
      background: none; border: none; cursor: pointer;
      color: rgba(140,180,255,0.5); font-size: 13px; padding: 2px 4px;
      -webkit-app-region: no-drag;
      transition: color 0.2s;
    }
    .exp-close-btn:hover { color: rgba(255,100,100,0.9); }

    /* transcript */
    #notch-transcript {
      flex: 1;
      max-height: 240px;
      overflow-y: auto;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      scroll-behavior: smooth;
    }
    #notch-transcript::-webkit-scrollbar { width: 3px; }
    #notch-transcript::-webkit-scrollbar-track { background: transparent; }
    #notch-transcript::-webkit-scrollbar-thumb { background: rgba(0,200,255,0.25); border-radius: 2px; }

    .msg { display: flex; gap: 8px; align-items: flex-start; }
    .msg.user  { flex-direction: row-reverse; }
    .msg-bubble {
      max-width: 88%;
      padding: 7px 11px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.4;
      word-break: break-word;
    }
    .msg.user  .msg-bubble { background: rgba(58,160,255,0.18); border: 1px solid rgba(58,160,255,0.3); color: #c8e8ff; border-radius: 12px 12px 2px 12px; }
    .msg.jarvis .msg-bubble { background: rgba(0,200,100,0.1); border: 1px solid rgba(0,200,100,0.2); color: #c8ffe0; border-radius: 12px 12px 12px 2px; }
    .msg-avatar { font-size: 11px; opacity: 0.5; padding-top: 4px; flex-shrink: 0; }

    /* data chips */
    .data-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(0,200,255,0.1);
      border: 1px solid rgba(0,200,255,0.25);
      border-radius: 8px;
      padding: 4px 8px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      color: #7dd8ff;
      margin-top: 4px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .data-chip:hover { background: rgba(0,200,255,0.2); }

    /* thinking indicator */
    #thinking-row { display: none; padding: 4px 14px 8px; }
    #thinking-row.show { display: flex; align-items: center; gap: 6px; }
    .think-dot { width:5px;height:5px;border-radius:50%;background:#ff9f1c;animation:td 1.2s infinite; }
    .think-dot:nth-child(2){animation-delay:.2s}.think-dot:nth-child(3){animation-delay:.4s}
    @keyframes td{0%,80%,100%{opacity:.2}40%{opacity:1}}
    #thinking-label { font-size:11px;color:rgba(255,160,60,0.7);letter-spacing:.06em; }

    /* live hearing */
    #notch-hearing {
      padding: 4px 14px;
      font-size: 12px;
      color: rgba(58,160,255,0.7);
      font-style: italic;
      min-height: 20px;
      letter-spacing: 0.02em;
    }

    /* input row */
    #notch-input-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px 10px;
      border-top: 1px solid rgba(0,200,255,0.12);
    }
    #notch-input {
      flex: 1;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(0,200,255,0.2);
      border-radius: 10px;
      padding: 7px 11px;
      color: #e0f0ff;
      font-family: 'Rajdhani', sans-serif;
      font-size: 13px;
      font-weight: 500;
      outline: none;
      transition: border-color 0.2s;
    }
    #notch-input:focus { border-color: rgba(0,200,255,0.5); background: rgba(255,255,255,0.08); }
    #notch-input::placeholder { color: rgba(140,180,255,0.35); }

    .notch-btn {
      background: none;
      border: 1px solid rgba(0,200,255,0.25);
      border-radius: 9px;
      color: rgba(140,200,255,0.7);
      cursor: pointer;
      padding: 6px 9px;
      font-size: 14px;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .notch-btn:hover { background: rgba(0,200,255,0.12); border-color: rgba(0,200,255,0.5); color: #fff; }
    .notch-btn.active { background: rgba(58,160,255,0.2); border-color: #3aa0ff; color: #3aa0ff; }
    #mic-btn.recording { background: rgba(255,60,60,0.2); border-color: #ff4444; color: #ff4444; animation: pulse-orb 0.8s infinite; }

    /* screen capture waveform bars */
    .wf-mini { display:flex;align-items:center;gap:2px;height:16px; }
    .wf-bar { width:2px;border-radius:1px;background:#3aa0ff;animation:wfb 0.8s infinite; }
    .wf-bar:nth-child(1){height:4px;animation-delay:0s}
    .wf-bar:nth-child(2){height:10px;animation-delay:.1s}
    .wf-bar:nth-child(3){height:7px;animation-delay:.2s}
    .wf-bar:nth-child(4){height:13px;animation-delay:.15s}
    .wf-bar:nth-child(5){height:5px;animation-delay:.05s}
    @keyframes wfb{0%,100%{transform:scaleY(0.4)}50%{transform:scaleY(1)}}

    /* scan line overlay */
    .scan-line { position:fixed;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(0,200,255,0.4),transparent);animation:scan 4s linear infinite;pointer-events:none; }
    @keyframes scan{0%{transform:translateY(0)}100%{transform:translateY(100vh)}}

    /* corner brackets */
    .corner-br { position:fixed; pointer-events:none; }
    .corner-br.tl { top:0;left:0;border-top:1px solid rgba(0,200,255,0.25);border-left:1px solid rgba(0,200,255,0.25);width:12px;height:12px; }
    .corner-br.tr { top:0;right:0;border-top:1px solid rgba(0,200,255,0.25);border-right:1px solid rgba(0,200,255,0.25);width:12px;height:12px; }
  </style>
</head>
<body>
  <div class="scan-line"></div>
  <div class="corner-br tl"></div>
  <div class="corner-br tr"></div>

  <div id="notch">
    <!-- COLLAPSED PILL -->
    <div id="pill-collapsed" onclick="toggleExpand()">
      <div class="pill-orb" id="pill-orb"></div>
      <span id="pill-status-text">JARVIS ONLINE</span>
      <span class="pill-mic-icon" id="pill-wf">
        <div class="wf-mini"><div class="wf-bar"></div><div class="wf-bar"></div><div class="wf-bar"></div><div class="wf-bar"></div><div class="wf-bar"></div></div>
      </span>
    </div>

    <!-- EXPANDED PANEL -->
    <div id="pill-expanded">
      <div class="exp-header">
        <div class="pill-orb" id="exp-orb" style="width:8px;height:8px"></div>
        <div class="exp-header-title">J.A.R.V.I.S — NOTCH INTERFACE</div>
        <button class="exp-close-btn" onclick="toggleExpand()" title="Collapse">▲</button>
      </div>

      <div id="notch-transcript"></div>

      <div id="notch-hearing"></div>

      <div id="thinking-row">
        <div class="think-dot"></div><div class="think-dot"></div><div class="think-dot"></div>
        <span id="thinking-label">PROCESSING…</span>
      </div>

      <div id="notch-input-row">
        <input id="notch-input" type="text" placeholder="Type or just say "Hey Jarvis…"" autocomplete="off" spellcheck="false"/>
        <button class="notch-btn" onclick="sendMessage()" title="Send">⏎</button>
      </div>
    </div>
  </div>

  <script src="notch-bar.js"></script>
</body>
</html>
